<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Багийн тэмцээний самбар</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: scoring console on top (rounds × teams), big projector-style leaderboard below */
:root{
  --bg:#f2f1f7; --panel:#ffffff; --ink:#17142b; --muted:#625e78; --line:#dcd9e8;
  --accent:#5b3df5; --accent-ink:#ffffff; --gold:#e0a400; --silver:#8f96a6; --bronze:#c06a2c;
  --display:"Unbounded",system-ui,sans-serif; --body:"Golos Text",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#110f1f; --panel:#1b1830; --ink:#f1effa; --muted:#a29dbd; --line:#2e2a48;
  --accent:#8b74ff; --accent-ink:#110f1f; --gold:#ffc83d; --silver:#b9c0cf; --bronze:#e08a4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110f1f; --panel:#1b1830; --ink:#f1effa; --muted:#a29dbd; --line:#2e2a48;
  --accent:#8b74ff; --accent-ink:#110f1f; --gold:#ffc83d; --silver:#b9c0cf; --bronze:#e08a4a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:28px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(24px,5vw,40px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:65ch}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);font-weight:600}
section{display:grid;gap:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.teams label{display:grid;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=number]{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box;text-transform:none;letter-spacing:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.round{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.rhead{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:end}
.rhead input[type=text]{font-weight:600}
.wt{display:flex;align-items:center;gap:4px;color:var(--muted)}
.wt input{text-align:right;padding:8px 6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.places{display:flex;gap:4px}
.places button{font:600 13px var(--body);width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.places button:hover{border-color:var(--accent);color:var(--ink)}
.places button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.places button.taken:not(.on){opacity:.35}
.tie{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.tie input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.warn{font-size:12px;color:var(--bronze);min-height:18px}
.btn{font:600 14px var(--body);border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.board{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px}
.lb{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.lb:first-of-type{border-top:0}
.rank{font-family:var(--display);font-weight:900;font-size:28px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.lb[data-r="1"] .rank{color:var(--gold)} .lb[data-r="2"] .rank{color:var(--silver)} .lb[data-r="3"] .rank{color:var(--bronze)}
.who{display:grid;gap:6px;min-width:0}
.who .n{font-family:var(--display);font-weight:700;font-size:clamp(16px,3vw,22px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s ease}
.brk{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.score{font-family:var(--display);font-weight:900;font-size:clamp(22px,4.5vw,34px);font-variant-numeric:tabular-nums;text-align:right}
.score small{display:block;font:500 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.big .board{padding:28px}
.big .rank{font-size:44px} .big .who .n{font-size:clamp(20px,4vw,34px)} .big .score{font-size:clamp(28px,6vw,52px)}
.big .lb{grid-template-columns:72px minmax(0,1fr) auto}
#setup{display:grid;gap:28px}
.big #setup{display:none}
@media (max-width:480px){.lb{grid-template-columns:40px minmax(0,1fr) auto;gap:10px}.rank{font-size:22px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header>
    <h1>Багийн тэмцээний самбар</h1>
    <p class="sub">Даваа бүрт баг бүрийн байрыг сонгоно. Байрны оноог тухайн давааны жингээр үржүүлж нийлбэрээр нь жагсаана.</p>
    <div class="rules"><span class="chip"><b>1-р байр</b> 5 оноо</span><span class="chip"><b>2-р байр</b> 4 оноо</span><span class="chip"><b>3-р байр</b> 3 оноо</span><span class="chip"><b>4-р байр</b> 2 оноо</span><span class="chip"><b>5-р байр</b> 1 оноо</span><span class="chip"><b>6-р байр</b> 0 оноо</span></div>
  </header>

  <div id="setup">
    <section>
      <div class="head"><h2>Багууд</h2></div>
      <div class="teams" id="teams"></div>
    </section>
    <section>
      <div class="head"><h2>Даваа ба байр</h2><span class="chip" id="wsum"></span></div>
      <div class="rounds" id="rounds"></div>
    </section>
  </div>

  <section>
    <div class="head">
      <h2>Жагсаалт</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="reset" type="button">Байруудыг арилгах</button>
        <button class="btn primary" id="show" type="button">Багуудад харуулах</button>
      </div>
    </div>
    <div class="board" id="board"></div>
  </section>
</div>

<script>
const PTS={1:5,2:4,3:3,4:2,5:1,6:0};
const N=6;
const KEY='team-scoreboard-v2';
let S={
  teams:['Баг 1','Баг 2','Баг 3','Баг 4','Баг 5','Баг 6'],
  rounds:[{name:'Бодлого',w:40},{name:'Үгийн сүлжээ',w:30},{name:'Kahoot',w:40}],
  place:[[1,3,2,4,6,5],[2,1,5,3,4,6],[3,2,1,6,5,4]] // жишээ байрууд
};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.teams&&s.rounds&&s.place)S=s}catch(e){}
S.rounds.forEach((r,i)=>{if(r.tie===undefined)r.tie=i===0});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('mn-MN',{minimumFractionDigits:2,maximumFractionDigits:2});

function renderTeams(){
  document.getElementById('teams').innerHTML=S.teams.map((t,i)=>
    `<label for="team${i}">Баг ${i+1}<input type="text" id="team${i}" data-t="${i}" value="${esc(t)}"></label>`).join('');
}
function renderRounds(){
  document.getElementById('rounds').innerHTML=S.rounds.map((r,ri)=>{
    const used=S.place[ri];
    const dup=!r.tie&&used.filter((p,i)=>p&&used.indexOf(p)!==i).length;
    return `<div class="round">
      <div class="rhead">
        <input type="text" id="rname${ri}" data-rn="${ri}" value="${esc(r.name)}" aria-label="Давааны нэр">
        <span class="wt"><input type="number" id="rw${ri}" data-rw="${ri}" value="${r.w}" min="0" max="100" aria-label="Жин">%</span>
      </div>
      <label class="tie" for="rtie${ri}"><input type="checkbox" id="rtie${ri}" data-tie="${ri}" ${r.tie?'checked':''}> Тэнцсэн багууд ижил байр авна</label>
      ${S.teams.map((t,ti)=>`<div class="row"><span class="nm">${esc(t)}</span><div class="places">${
        Array.from({length:N},(_,k)=>k+1).map(p=>`<button type="button" data-r="${ri}" data-t="${ti}" data-p="${p}" class="${used[ti]===p?'on':''} ${!r.tie&&used.includes(p)?'taken':''}" aria-pressed="${used[ti]===p}">${p}</button>`).join('')
      }</div></div>`).join('')}
      <div class="warn">${dup?'Нэг байрыг хоёр баг авсан байна':''}</div>
    </div>`}).join('');
  const sum=S.rounds.reduce((a,r)=>a+(+r.w||0),0);
  document.getElementById('wsum').innerHTML=`Жингийн нийлбэр <b>${sum}%</b>`;
}
function renderBoard(){
  const max=S.rounds.reduce((a,r)=>a+5*(+r.w||0)/100,0)||1;
  const rows=S.teams.map((t,ti)=>{
    let tot=0,cnt=0;const parts=S.rounds.map((r,ri)=>{const p=S.place[ri][ti];if(p)cnt++;const pts=p?PTS[p]:0;const v=pts*(+r.w||0)/100;tot+=v;
      return `${esc(r.name)}: ${p?p+'-р байр':'—'} (${fmt(v)})`});
    return {t,tot,parts,cnt};
  }).sort((a,b)=>(b.cnt>0)-(a.cnt>0)||b.tot-a.tot);
  let rank=0,prev=null;
  document.getElementById('board').innerHTML=rows.map((r,i)=>{
    if(prev===null||Math.abs(r.tot-prev)>1e-9){rank=i+1;prev=r.tot}
    const shown=r.cnt?rank:'–';
    return `<div class="lb" data-r="${r.cnt?rank:0}">
      <div class="rank">${shown}</div>
      <div class="who"><div class="n">${esc(r.t)}</div><div class="bar"><i style="width:${(r.tot/max*100).toFixed(1)}%"></i></div><div class="brk">${r.parts.join(' · ')}</div></div>
      <div class="score">${fmt(r.tot)}<small>нийт оноо</small></div>
    </div>`}).join('');
}
function all(){renderTeams();renderRounds();renderBoard()}

document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(d.tie!==undefined){const ri=+d.tie;S.rounds[ri].tie=e.target.checked;
    if(!e.target.checked){const seen={};S.place[ri]=S.place[ri].map(p=>{if(!p)return 0;if(seen[p])return 0;seen[p]=1;return p})}
    save();renderRounds();renderBoard()}
});
document.addEventListener('input',e=>{
  const d=e.target.dataset;
  if(d.tie!==undefined)return;
  if(d.t!==undefined&&e.target.id.startsWith('team')){S.teams[+d.t]=e.target.value;renderRoundsKeep();renderBoard()}
  else if(d.rn!==undefined){S.rounds[+d.rn].name=e.target.value;renderBoard()}
  else if(d.rw!==undefined){S.rounds[+d.rw].w=e.target.value===''?0:+e.target.value;
    const sum=S.rounds.reduce((a,r)=>a+(+r.w||0),0);document.getElementById('wsum').innerHTML=`Жингийн нийлбэр <b>${sum}%</b>`;renderBoard()}
  save();
});
function renderRoundsKeep(){ // update team names in rounds without losing focus
  document.querySelectorAll('.round').forEach(rd=>rd.querySelectorAll('.nm').forEach((n,ti)=>n.textContent=S.teams[ti]));
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.places button');
  if(b){const r=+b.dataset.r,t=+b.dataset.t,p=+b.dataset.p;
    const row=S.place[r];
    if(row[t]===p){row[t]=0}else{if(!S.rounds[r].tie){const other=row.indexOf(p);if(other>-1)row[other]=0}row[t]=p}
    save();renderRounds();renderBoard();
    const again=document.querySelector(`.places button[data-r="${r}"][data-t="${t}"][data-p="${p}"]`);again&&again.focus();
  }
});
const resetBtn=document.getElementById('reset');let armed=false,tm;
resetBtn.addEventListener('click',()=>{
  if(!armed){armed=true;resetBtn.textContent='Дахин дарж баталгаажуулна уу';tm=setTimeout(()=>{armed=false;resetBtn.textContent='Байруудыг арилгах'},3000);return}
  clearTimeout(tm);armed=false;resetBtn.textContent='Байруудыг арилгах';
  S.place=S.rounds.map(()=>S.teams.map(()=>0));save();renderRounds();renderBoard();
});
const app=document.getElementById('app'),showBtn=document.getElementById('show');
showBtn.addEventListener('click',()=>{
  const on=app.classList.toggle('big');
  showBtn.textContent=on?'Засах горим руу буцах':'Багуудад харуулах';
  if(on)window.scrollTo({top:0});
});
all();
</script>
</body>
</html>
